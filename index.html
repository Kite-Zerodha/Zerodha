<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kite</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background-color: #13171a; /* Kite Dark Theme */
      overflow: hidden;
      overscroll-behavior-y: none;
      user-select: none;
      touch-action: none; 
    }

    /* पीछे का पूरा स्क्रीनशॉट जो अपनी जगह फिक्स रहेगा */
    .app-background {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('screenshot.jpg'); 
      background-size: 100vw 100vh;
      background-position: top center; 
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* रिफ्रेश स्पिनर रखने की जगह (Holdings टैब के नीचे - 130px) */
    .spinner-container {
      position: absolute;
      top: 130px; 
      left: 0; width: 100%;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; 
      pointer-events: none; /* ताकि नीचे के बटन दब सकें */
    }

    /* खुला हुआ मोटा नीला तीर (बिना किसी डिब्बे के) */
    .svg-icon {
      width: 26px; height: 26px;
      stroke: #4184f3; /* Kite Blue */
      opacity: 0; /* शुरू में छुपा रहेगा */
      transform: translateY(0px) rotate(0deg);
    }

    /* गोल घूमने का एनीमेशन */
    .spinning .svg-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: translateY(30px) rotate(0deg); }
      100% { transform: translateY(30px) rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- मेन स्क्रीनशॉट -->
  <div class="app-background"></div>

  <!-- रिफ्रेश वाला तीर -->
  <div class="spinner-container" id="spinner-container">
    <svg class="svg-icon" id="spinner-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
    </svg>
  </div>

  <script>
    const spinnerContainer = document.getElementById('spinner-container');
    const spinnerArrow = document.getElementById('spinner-arrow');
    
    let startY = 0;
    let currentY = 0;
    let isRefreshing = false;
    
    document.addEventListener('touchstart', (e) => {
      if (!isRefreshing) startY = e.touches[0].clientY;
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (isRefreshing) return;
      currentY = e.touches[0].clientY;
      let distance = currentY - startY;

      // अगर नीचे की तरफ खींच रहे हैं
      if (distance > 0) {
        e.preventDefault();
        
        // तीर थोड़ा नीचे खिसकेगा (Max 30px)
        let pullDistance = Math.min(distance * 0.3, 30); 
        
        // उंगली के हिसाब से तीर दिखेगा और घूमेगा
        spinnerArrow.style.opacity = Math.min(distance / 60, 1);
        spinnerArrow.style.transform = `translateY(${pullDistance}px) rotate(${distance * 2}deg)`;
      }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
      if (isRefreshing || startY === 0) return;
      
      let distance = currentY - startY;

      // अगर 60px से ज्यादा खींचा है, तो रिफ्रेश चालू
      if (distance > 60) {
        isRefreshing = true;
        
        // एनीमेशन क्लास लगाओ ताकि गोल घूमे
        spinnerContainer.classList.add('spinning'); 
        spinnerArrow.style.opacity = 1;

        // 1.5 सेकंड बाद गायब
        setTimeout(() => {
          spinnerContainer.classList.remove('spinning');
          spinnerArrow.style.opacity = 0;
          spinnerArrow.style.transform = `translateY(0px) rotate(0deg)`;
          isRefreshing = false;
          startY = 0;
        }, 1500); 
      } else {
        // पूरा नहीं खींचा तो तुरंत वापस छुपा दो
        spinnerArrow.style.opacity = 0;
        spinnerArrow.style.transform = `translateY(0px) rotate(0deg)`;
        startY = 0;
      }
    });

    // PWA Service Worker को रजिस्टर करने का कोड (ताकि Install App आ सके)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
