<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kite</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background-color: #13171a; /* Kite का डार्क हेडर कलर */
      overflow: hidden;
      overscroll-behavior-y: none;
      user-select: none;
      touch-action: none; 
    }

    .app-background {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('screenshot.jpg'); 
      /* cover से फोटो पिचकेगी नहीं, एकदम परफेक्ट रेश्यो में फुल स्क्रीन होगी */
      background-size: cover; 
      background-position: top center; 
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* रिफ्रेश कंटेनर जो अब 80px तक नीचे आएगा */
    .spinner-container {
      position: absolute;
      top: 130px; /* Holdings टैब के नीचे की जगह */
      left: 0; width: 100%;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; 
      pointer-events: none; 
      transform: translateY(0px); /* उंगली से कंट्रोल होगा */
      transition: transform 0.1s ease-out; /* स्मूथ वापस जाने के लिए */
    }

    /* खुला हुआ मोटा नीला तीर */
    .svg-icon {
      width: 26px; height: 26px;
      stroke: #4184f3; 
      opacity: 0; 
    }

    /* जब रिफ्रेश चालू हो, तो सिर्फ तीर घूमेगा */
    .spinning .svg-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- मेन स्क्रीनशॉट -->
  <div class="app-background"></div>

  <!-- रिफ्रेश वाला हिस्सा -->
  <div class="spinner-container" id="spinner-container">
    <svg class="svg-icon" id="spinner-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
    </svg>
  </div>

  <script>
    const spinnerContainer = document.getElementById('spinner-container');
    const spinnerArrow = document.getElementById('spinner-arrow');
    
    let startY = 0;
    let currentY = 0;
    let isRefreshing = false;
    
    document.addEventListener('touchstart', (e) => {
      if (!isRefreshing) startY = e.touches[0].clientY;
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (isRefreshing) return;
      currentY = e.touches[0].clientY;
      let distance = currentY - startY;

      if (distance > 0) {
        e.preventDefault();
        
        // अब कंटेनर 80px तक नीचे आ सकता है (पहले सिर्फ 30 था)
        let pullDistance = Math.min(distance * 0.45, 80); 
        spinnerContainer.style.transition = 'none'; // खींचते वक़्त डिले ना हो
        spinnerContainer.style.transform = `translateY(${pullDistance}px)`;
        
        spinnerArrow.style.opacity = Math.min(distance / 60, 1);
        spinnerArrow.style.transform = `rotate(${distance * 2}deg)`;
      }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
      if (isRefreshing || startY === 0) return;
      
      let distance = currentY - startY;
      let pullDistance = Math.min(distance * 0.45, 80);

      spinnerContainer.style.transition = 'transform 0.3s ease-out'; // वापस जाने में स्मूथनेस

      if (pullDistance > 50) { // 50px खींचने पर रिफ्रेश चालू
        isRefreshing = true;
        
        // 60px पर होल्ड करेगा और घूमेगा
        spinnerContainer.style.transform = `translateY(60px)`; 
        spinnerContainer.classList.add('spinning'); 
        spinnerArrow.style.opacity = 1;
        spinnerArrow.style.transform = `rotate(0deg)`; // ताकि keyframe एनीमेशन काम करे

        setTimeout(() => {
          spinnerContainer.classList.remove('spinning');
          spinnerContainer.style.transform = `translateY(0px)`; // वापस ऊपर
          spinnerArrow.style.opacity = 0;
          isRefreshing = false;
          startY = 0;
        }, 1500); 
      } else {
        // पूरा नहीं खींचा तो तुरंत वापस 
        spinnerContainer.style.transform = `translateY(0px)`;
        spinnerArrow.style.opacity = 0;
        startY = 0;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
